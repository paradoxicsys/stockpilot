# StockPilot CI/CD
#
#   test ──► build + scan + push ──► deploy (EKS)
#
# - Every push / PR to main runs the tests and builds + scans the images.
# - Only pushes to main publish images to GHCR (tagged with the commit SHA).
# - Deploy runs only when the repository variable DEPLOY_ENABLED is "true"
#   (switch it off after `terraform destroy` so the pipeline stays green).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Trivy runs from its official image, pinned to an exact version
  TRIVY_IMAGE: aquasec/trivy:0.74.0

jobs:
  # ───────────────────────── 1. TEST ─────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest (fails the pipeline on any failing test)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ─────────────── 2. BUILD + SECURITY SCAN + PUSH ───────────────
  build-scan-push:
    name: Build, scan & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image names and tag
        id: meta
        run: |
          # GHCR image names must be lowercase
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=${GITHUB_SHA}"
            echo "backend_image=${REGISTRY}/${owner}/stockpilot-backend"
            echo "frontend_image=${REGISTRY}/${owner}/stockpilot-frontend"
          } >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }} \
            ./frontend

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Fails the job (exit code 1) on any HIGH or CRITICAL vulnerability that
      # has a fix available. Nothing is pushed unless both scans pass.
      - name: Trivy scan - backend
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/trivy \
            "${TRIVY_IMAGE}" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}

      - name: Trivy scan - frontend
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/trivy \
            "${TRIVY_IMAGE}" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
          {
            echo "### Images pushed"
            echo "- \`${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 3. DEPLOY ─────────────────────────
  deploy:
    name: Deploy to EKS
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job exchange a GitHub OIDC token for AWS credentials
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'stockpilot-eks' }}
      TAG: ${{ needs.build-scan-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # No AWS keys stored in GitHub: assumes the role Terraform created
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - uses: azure/setup-helm@v5

      - name: Helm upgrade --install
        run: |
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot --create-namespace \
            -f helm/stockpilot/values-eks.yaml \
            --set backend.image.repository=${{ needs.build-scan-push.outputs.backend_image }} \
            --set backend.image.tag="${TAG}" \
            --set frontend.image.repository=${{ needs.build-scan-push.outputs.frontend_image }} \
            --set frontend.image.tag="${TAG}" \
            --wait --timeout 10m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/stockpilot-backend -n stockpilot --timeout=5m
          kubectl rollout status deployment/stockpilot-frontend -n stockpilot --timeout=5m
          kubectl get pods,svc,hpa,ingress -n stockpilot
          helm test stockpilot -n stockpilot --logs

      - name: Roll back on failure
        if: failure()
        run: helm rollback stockpilot -n stockpilot --wait || true
