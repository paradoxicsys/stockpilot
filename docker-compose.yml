# Full local stack: docker compose up --build  ->  http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot   # local development only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: stockpilot-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@postgres:5432/stockpilot
      SEED_DATA: "true"
      APP_VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: local
    image: stockpilot-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  pgdata:
