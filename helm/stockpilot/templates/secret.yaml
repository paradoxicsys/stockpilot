{{- $password := include "stockpilot.dbPassword" . -}}
{{- $auth := .Values.postgres.auth -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpilot.secretName" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ $auth.database | quote }}
  POSTGRES_USER: {{ $auth.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" $auth.username $password (include "stockpilot.postgresHost" .) $auth.database | quote }}
