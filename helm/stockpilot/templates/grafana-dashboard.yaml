{{- if .Values.monitoring.grafanaDashboard.enabled }}
# The Grafana sidecar in kube-prometheus-stack loads any ConfigMap with this label
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-dashboard
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot.json: |-
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
{{- end }}
