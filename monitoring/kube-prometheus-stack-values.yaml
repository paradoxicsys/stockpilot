# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from every namespace and release, not only this chart's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

grafana:
  # Classroom only. For anything real, use grafana.admin.existingSecret.
  adminPassword: stockpilot-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL   # load the StockPilot dashboard ConfigMap from its own namespace
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

alertmanager:
  enabled: false   # not part of this project; saves resources on small clusters

# Small clusters: skip control-plane components EKS doesn't expose
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
