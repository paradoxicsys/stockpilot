# LAB 2: the pods are healthy but the Service sends traffic nowhere.
#   kubectl apply -f troubleshooting/broken-service.yaml
#   kubectl get pods -n stockpilot-lab --show-labels       -> app=label-printer
#   kubectl get svc,endpointslices -n stockpilot-lab        -> no endpoints
#   kubectl describe svc label-printer -n stockpilot-lab    -> Selector: app=labelprinter
#   kubectl run tmp -n stockpilot-lab --rm -it --image=curlimages/curl:8.11.1 --restart=Never \
#     -- curl -m 3 http://label-printer                     -> times out / connection refused
# Fix the selector so it matches the pod labels, re-apply, and endpoints appear.
apiVersion: v1
kind: Namespace
metadata:
  name: stockpilot-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-printer
  namespace: stockpilot-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: label-printer
  template:
    metadata:
      labels:
        app: label-printer
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: label-printer
  namespace: stockpilot-lab
spec:
  selector:
    app: labelprinter   # BUG: does not match the pod label "label-printer"
  ports:
    - port: 80
      targetPort: 8080
