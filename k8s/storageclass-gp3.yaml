# EKS only: default StorageClass backed by the EBS CSI driver (installed by
# Terraform). PostgreSQL's PersistentVolumeClaim gets an encrypted gp3 volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer   # create the volume in the AZ where the pod lands
reclaimPolicy: Delete
allowVolumeExpansion: true
